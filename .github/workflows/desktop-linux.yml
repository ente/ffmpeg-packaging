name: Desktop Linux

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/desktop-linux.yml"
      - ".github/workflows/release.yml"
      - "versions.env"
      - "scripts/build-desktop-cli.sh"
      - "scripts/common.sh"
      - "scripts/fetch-sources.sh"
      - "scripts/verify-desktop-cli.sh"
      - "patches/x264/**"
      - "tests/desktop_cli/**"

permissions:
  contents: read

env:
  FFMPEG_WORKSPACE: ${{ github.workspace }}-build

jobs:
  build:
    name: Build and verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
          - arch: arm64
            runner: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils python3 ripgrep

      - name: Build desktop CLI
        run: |
          mkdir -p "$FFMPEG_WORKSPACE"
          docker run --rm \
            -v "$PWD:/src:ro" -v "$FFMPEG_WORKSPACE:/build" \
            -w /src -e FFMPEG_WORKSPACE=/build \
            "${{ matrix.image }}" bash -ec '
              dnf upgrade -y --security
              dnf install -y meson ninja-build nasm ripgrep xz-devel
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              git config --global --add safe.directory /src
              scripts/build-desktop-cli.sh desktop-linux-${{ matrix.arch }}
            '

      - name: Verify on Ubuntu
        run: |
          mkdir -p artifact
          tar -xzf "$FFMPEG_WORKSPACE/dist/desktop/linux-${{ matrix.arch }}/ffmpeg.tar.gz" -C artifact
          WORK_ROOT="$RUNNER_TEMP/ffmpeg-verify" scripts/verify-desktop-cli.sh "$PWD/artifact"

      - name: Verify on glibc 2.28
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe \
            bash -ec '
              dnf upgrade -y --security
              dnf install -y python3.12 libstdc++ zlib xz-libs
              python3.12 /src/tests/desktop_cli/verify_media.py \
                --ffmpeg /src/artifact/ffmpeg --ffprobe /src/artifact/ffprobe \
                --work-dir /tmp/verify --target linux-${{ matrix.arch }}
            '

      - name: Upload desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-linux-${{ matrix.arch }}
          path: |
            ${{ env.FFMPEG_WORKSPACE }}/dist/desktop/linux-${{ matrix.arch }}/ffmpeg.tar.gz
            ${{ env.FFMPEG_WORKSPACE }}/dist/desktop/linux-${{ matrix.arch }}/ffmpeg.tar.gz.sha256
            ${{ env.FFMPEG_WORKSPACE }}/dist/desktop/linux-${{ matrix.arch }}/ffmpeg.tar.gz.manifest.env
          if-no-files-found: error
